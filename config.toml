[settings]
poll_interval_s = 1        # cada cuánto se mira la ventana activa (barato)
ocr_interval_s = 15        # mínimo entre dos OCR de la misma ventana
ocr_after_switch_s = 2     # espera tras cambiar de ventana antes del primer OCR
change_threshold = 3.0     # diferencia visual mínima (0-255) para repetir el OCR
idle_threshold_s = 300     # sin teclado/ratón durante este tiempo = ausente
media_keeps_present = true # con el micrófono o la cámara en uso (una llamada) no se está ausente
ocr_language = ""          # "" = idiomas del perfil de Windows; p. ej. "es-ES" o "en-US"
db_path = "data/timesheet.db"

[privacy]
# Ventanas en las que nunca se hace OCR (sí se registra el tiempo y el título).
exclude_processes = ["KeePass*.exe", "1Password.exe", "Bitwarden.exe"]
exclude_title_regex = [
    "(?i)incognito|inprivate|navegaci[oó]n privada|private browsing",
]
redact = true              # enmascara emails, IBAN, números largos y "password: ..."
max_ocr_chars = 4000

[ui]
port = 8765                    # panel en http://127.0.0.1:8765
open_browser_on_start = false  # abrir el panel al arrancar

[topic]
# Aplicaciones en las que se saca el «Tema» de la actividad: el asunto del correo abierto,
# que es la línea de letra más grande dentro de "area" (x0, y0, x1, y1 en fracción de la
# ventana; 0,0 = arriba a la izquierda). Se reconocen por la URL (dominio + ruta, sin https://)
# o por el título de la ventana; regex entre comillas simples para no duplicar las barras.
[[topic.apps]]
name = "Outlook"
url = '^outlook\.(cloud\.microsoft|office\.com|office365\.com|live\.com)'
title = '(?i)\boutlook\b'
area = [0.40, 0.15, 1.0, 0.60]   # panel de lectura, a la derecha de la lista de correos
# Vistas sin un correo abierto: ahí lo más grande de la pantalla no es un asunto.
no_topic = '(?i)^(calendar|calendario|people|personas|files|archivos|to do|tareas|notes|notas|settings|configuración) - '
# Botón que Outlook pinta en la misma línea que el asunto.
strip = '(?i)\s+(summari[sz]e this email|resumir este correo( electrónico)?|resumen)$'

[[topic.apps]]
name = "Gmail"
url = '^mail\.google\.com/mail'
title = '(?i)\bgmail\b'
area = [0.12, 0.10, 1.0, 0.60]
# Gmail pone el asunto en el título («asunto - email - Gmail» o «… - Empresa Mail»): se saca de
# ahí y no del OCR. Las bandejas y carpetas no son un asunto.
title_topic = '^(?P<topic>.+?) - [^\s@]+@[^\s@]+ - .*\b(Gmail|Mail)$'
title_skip = '(?i)^(inbox|recibidos|bandeja de entrada|starred|destacados|snoozed|pospuestos|important|importantes|sent( mail)?|enviados|drafts|borradores|scheduled|programados|all mail|todos|spam|trash|bin|papelera|search results|resultados de (la )?b[uú]squeda|chat|spaces|espacios|meet|home|inicio)\b'
